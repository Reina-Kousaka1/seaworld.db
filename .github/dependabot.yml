version: 2
updates:
  # Keep routine test/property tooling independent from the storage engine's
  # runtime utility. Major releases remain individual review items.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "03:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      test-and-property-tools-minor-patch:
        applies-to: version-updates
        patterns:
          - proptest
        update-types:
          - minor
          - patch
      runtime-utility-minor-patch:
        applies-to: version-updates
        patterns:
          - getrandom
        update-types:
          - minor
          - patch

  # Workflow updates are operational tooling only; major action changes still
  # arrive separately for review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "03:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      ci-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
