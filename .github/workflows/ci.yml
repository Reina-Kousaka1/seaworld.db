name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run so the long capacity class executes even without pushes.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV 1.89 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - name: Check declared minimum Rust version
        run: cargo check --all-targets --features crash-test --locked

  rust:
    name: Rust engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is a native GitHub-hosted Linux ARM64 runner, not
        # QEMU emulation and not Raspberry Pi hardware qualification.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check whitespace
        run: git diff --check
      - name: Clippy without test hooks
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy with crash-test harness
        run: cargo clippy --all-targets --features crash-test --locked -- -D warnings
      - name: Run engine and process crash tests
        run: cargo test --all-targets --features crash-test --locked
      - name: Build release library
        run: cargo build --release --locked

  capacity:
    name: Capacity class (${{ matrix.os }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run long file-capacity regression tests
        run: cargo test --release --features crash-test --locked --test capacity -- --ignored --nocapture
