name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy without test hooks
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy with crash-test harness
        run: cargo clippy --all-targets --features crash-test --locked -- -D warnings
      - name: Run engine and process crash tests
        run: cargo test --all-targets --features crash-test --locked
      - name: Build release library
        run: cargo build --release --locked

  java-reference:
    name: Java v1 reference suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run tests
        shell: pwsh
        run: ./scripts/test.ps1
