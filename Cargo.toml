[package]
name = "seaworld-db"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Embedded document database engine"

[dependencies]
getrandom = "0.4.3"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[features]
crash-test = []

[[bin]]
name = "crash_writer"
path = "src/bin/crash_writer.rs"
required-features = ["crash-test"]

[[bin]]
name = "seaworld"
path = "src/bin/seaworld.rs"
